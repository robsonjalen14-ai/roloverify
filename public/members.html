<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Members — Rolo Verify</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/logo.png"></head><body>
<div class="nav"><div class="brand"><img src="/logo.png" alt="Rolo Verify logo" class="logo" onerror="this.outerHTML='🥔'"> Rolo <span>Verify</span> — Members</div><div><a class="btn ghost" href="/dashboard.html">Dashboard</a> <a class="btn ghost" href="/">Home</a></div></div>
<div class="wrap" style="max-width:900px">
<div class="banner" id="banner"></div>
<label for="guild">Server (admin servers only)</label><select id="guild"></select>
<div class="card"><h3>Verified members <span class="pill ok" id="count">0</span></h3>
<p class="muted">Everyone who verified through your link. Revoking cuts restores, never kicks.</p>
<label for="q">Search</label><input id="q" placeholder="Type a name or id…">
<div class="tablewrap"><table style="margin-top:12px"><thead><tr><th>Member</th><th>User ID</th><th>Email</th><th>IP</th><th>Country</th><th>Registered</th><th>Verified</th><th>Alt score</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="9" class="muted">Loading…</td></tr></tbody></table></div>
</div></div>
<script>
const $ = (id) => document.getElementById(id);
let GID = null, ALL = [];
function banner(msg, bad) {
  const b = $('banner');
  b.textContent = msg; b.classList.add('show'); b.classList.toggle('error', !!bad);
}
async function j(url, opts) {
  const r = await fetch(url, opts);
  const t = await r.text();
  let d = null; try { d = JSON.parse(t); } catch {}
  if (!r.ok) throw new Error((d && d.error) || t || ('failed (' + r.status + ')'));
  return d;
}
function ageOf(iso) {
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (!(d >= 0)) return '—';
  if (d < 30) return d + 'd ago';
  if (d < 365) return Math.floor(d / 30) + 'mo ago';
  return Math.floor(d / 365) + 'y ago';
}
function paint() {
  const q = $('q').value.trim().toLowerCase();
  const list = ALL.filter(m => !q || m.username.toLowerCase().includes(q) || m.id.includes(q));
  $('count').textContent = ALL.length;
  $('rows').innerHTML = list.length ? list.map(m => `<tr><td>${m.username}</td><td><code>${m.id}</code></td><td>${m.email || '—'}</td><td><code>${m.ip || '—'}</code></td><td>${m.country || '—'}</td><td>${ageOf(m.registered)}</td><td>${new Date(m.at).toLocaleString()}</td><td>${m.altScore >= 40 ? '<span class="pill bad">flagged</span>' : m.altScore}</td><td><button class="btn ghost" data-id="${m.id}">Revoke</button></td></tr>`).join('') : '<tr><td colspan="9" class="muted">Nobody here yet.</td></tr>';
  [...document.querySelectorAll('button[data-id]')].forEach(b => b.onclick = async () => {
    if (!confirm('Revoke this member?')) return;
    try { await j(`/api/guild/${GID}/members/${b.dataset.id}`, { method: 'DELETE' }); load(); }
    catch (e) { banner('Revoke failed: ' + e.message, true); }
  });
}
async function load() {
  if (!GID) return;
  try {
    const r = await j(`/api/guild/${GID}/members`);
    ALL = r.members; paint();
  } catch (e) { banner('Could not load members: ' + e.message, true); }
}
(async () => {
  try { await j('/api/me'); } catch { location.href = '/auth/discord'; return; }
  try {
    const g = await j('/api/my-guilds');
    if (!g.guilds.length) { banner('No admin servers found. You need Manage Server permission somewhere the bot also sits.', true); $('rows').innerHTML = '<tr><td colspan="9" class="muted">No servers.</td></tr>'; return; }
    $('guild').innerHTML = g.guilds.map(x => `<option value="${x.id}"></option>`).join('');
    [...$('guild').options].forEach((o, i) => { o.textContent = g.guilds[i].name; });
    GID = $('guild').value;
    $('guild').onchange = () => { GID = $('guild').value; load(); };
    $('q').oninput = paint;
    load();
  } catch (e) { banner('Could not load your servers: ' + e.message, true); }
})();
</script></body></html>
