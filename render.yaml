# Rolo Verify — one-click hosting on Render (render.com, free tier works)
# single Web Service runs BOTH the site and the discord bot (see Dockerfile CMD).
# create it via: Render → New → Blueprint → pick this repo. nothing else to create.
services:
  - type: web
    name: roloverify
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: BASE_URL
        sync: false # set after first deploy, e.g. https://roloverify.onrender.com
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false # https://YOUR-URL.onrender.com/auth/discord/callback
      - key: SESSION_SECRET
        generateValue: true
